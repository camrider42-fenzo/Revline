name: Android

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Assemble and test
        env:
          # Shot tests write PNGs here. The defaults are under /workspace, which the runner cannot create.
          CIRCUIT_GFX_DIR: ${{ github.workspace }}/circuit-gfx
          DRAG_GFX_DIR: ${{ github.workspace }}/drag-gfx
        run: ./gradlew assembleDebug testDebugUnitTest --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: revline-debug-apk
          path: app/build/outputs/apk/debug/*.apk
